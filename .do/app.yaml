# DigitalOcean App Platform — staging.
#
# Apply with:  doctl apps update <app-id> --spec .do/app.yaml
# (first time: doctl apps create --spec .do/app.yaml)
#
# App: 37909820-9c51-4831-a478-c1d235dccca9 — https://pwl-cashier-staging-rvz75.ondigitalocean.app
#
# Secrets: values marked `type: SECRET` are `EV[...]` ciphertexts that App Platform encrypted for
# this app only; they are safe to commit and keep this file applyable. To rotate one, replace the
# value with the new plain text in a local uncommitted copy, apply it, then commit the new `EV[...]`
# from `doctl apps spec get <app-id>`. Never commit a plain-text secret. Secrets are RUN_TIME only
# so they never reach the Docker build.
#
# Database: a Managed PostgreSQL 16 cluster, deliberately NOT attached as a `databases:` component.
# Attaching lets App Platform manage the database user, while we need two roles with different
# rights (docs/ops/database-roles.md). The app is added to the cluster's trusted sources instead.

name: pwl-cashier-staging
region: sgp1

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: api
    github:
      repo: rakapermanaptr/PWL-Backend
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    health_check:
      http_path: /health/ready
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 3
      failure_threshold: 4
    envs:
      - key: APP_ENV
        value: staging
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "false"
      - key: DATABASE_URL
        value: jdbc:postgresql://pwl-staging-db-do-user-35407037-0.d.db.ondigitalocean.com:25060/pwl?sslmode=require
      - key: DATABASE_USER
        value: pwl_app
      - key: DATABASE_PASSWORD
        type: SECRET
        scope: RUN_TIME
        value: EV[1:O0MxTg5bwlWpQ8dsf0KpyypuKaGn1A37:Q7FcOOYeW4RpG77CGM03Y8SEmRoJ5CGUolQhxohN/feTZbSrPgWdnm0x+HgkSbMD2TqjSlXdkj/Av3+dQEkG8e3eZR34M3kMexgvXrHX5BU=]
      # Managed PG 1 GB allows ~22 connections; leave room for the migration job and psql.
      - key: DATABASE_POOL_SIZE
        value: "8"
      - key: JWT_SECRET
        type: SECRET
        scope: RUN_TIME
        value: EV[1:ZjE5G1PpjPRs3VWlFnI8/0lHxOeo8XXf:K/rPG9xSf1PCzHccaIubbPytCVXFnebh78HvyvgZHp0magf1hVNpCKjMEcpLu0FUo99mhMyKdjQCW93T/C7jatY3+AM74dvelLnAvc5hBYU=]
      - key: PIN_PEPPER
        type: SECRET
        scope: RUN_TIME
        value: EV[1:Hm3Ta4gdkzb6kAYvq2v4mBPW6P+qKlbo:gpgU/u7QNEay3NegtOnBesSpKtnwRUMyZKbjGqd4pzegrhrOtBMqaPD3h+foJjjoW5nM1F7AbUs70+PLcA/12NotLyH47N+9Dhx8NMzLERk=]
      - key: MIN_APP_VERSION
        value: 0.0.0

jobs:
  # Runs before every rollout. If Flyway fails, the deployment stops and the old version keeps
  # serving — the API never boots against a half-migrated schema.
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: rakapermanaptr/PWL-Backend
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    run_command: ./bin/pwl-migrate
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        value: jdbc:postgresql://pwl-staging-db-do-user-35407037-0.d.db.ondigitalocean.com:25060/pwl?sslmode=require
      - key: DATABASE_USER
        value: pwl_migrator
      - key: DATABASE_PASSWORD
        type: SECRET
        scope: RUN_TIME
        value: EV[1:4tujKW4WUcK5K2XxFLDeN7y2w37OP6ig:4AviXtXyGbd+FFAy5+nacQSLoMU3Tq7+xOft9mD4+t1UC1nCd+lk7AorNrUMpSJRbGCLWdd9BPXvBCAkm6ne/EsaWhvSWX4mtRI/cAlBXbM=]
      - key: DATABASE_POOL_SIZE
        value: "2"
