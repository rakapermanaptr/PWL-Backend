name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI tidak pernah butuh kredensial Meta: integrasi WhatsApp adalah fase terakhir dan
  # API harus boot tanpa variabel WA_* sama sekali.
  APP_ENV: dev

jobs:
  verify:
    name: Build, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      # Testcontainers memakai Docker yang sudah tersedia di runner ubuntu-latest;
      # integration test wajib jalan terhadap Postgres asli, bukan database in-memory.
      - name: Integration tests (Testcontainers Postgres)
        run: ./gradlew integrationTest --no-daemon

      - name: Contract tests (openapi.yaml)
        run: ./gradlew contractTest --no-daemon

      - name: Build distribution
        run: ./gradlew installDist --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/detekt/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pwl-cashier:ci .
