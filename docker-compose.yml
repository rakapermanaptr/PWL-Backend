services:
  db:
    image: postgres:16-alpine
    container_name: pwl-db
    environment:
      POSTGRES_DB: pwl
      POSTGRES_USER: pwl
      POSTGRES_PASSWORD: pwl
      # Server dan database tidak boleh bergantung pada zona sistem (PRD §13).
      TZ: UTC
      PGTZ: UTC
    ports:
      # Port host bisa diubah lewat DB_PORT bila mesin sudah menjalankan Postgres lain.
      # Sesuaikan DATABASE_URL di .env kalau diubah.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pwl-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwl -d pwl"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:5
    container_name: pwl-adminer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  pwl-db-data:
