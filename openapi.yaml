        per unit belum diisi.") → nama unik tanpa beda huruf besar/kecil (`SERVICE_NAME_TAKEN`).
        `category`/`unit` di luar Lampiran A → 400. `step` = 0,5 bila `unit = kg`, selain itu 1. Audit
        `SERVICE_ADDED` "Tambah layanan {nama} — Rp{harga}/{unit} ({kategori})".
      operationId: createService
      requestBody:
