openapi: 3.1.0

info:
  title: PWL Cashier — Backend REST API Prima Wash
  version: 1.0.0-m2
  summary: REST API pusat untuk aplikasi kasir Android Prima Wash (Kasir Prima Laundry).
  description: |
    Kontrak resmi ada di `docs/PRD-Backend-REST-API.md`. Bila dokumen ini dan PRD berbeda,
    **PRD yang menang** — perbaiki file ini di PR yang sama.

    **Status M2.** Terspesifikasi lengkap: health, layar login & sesi, perangkat, cabang, staff, price
    list, loyalty, reward, customer (M1), serta order, sinkronisasi offline, shift & kas, cache tablet,
    dan heartbeat (M2). Permukaan milestone berikutnya didaftar di
    `x-planned-endpoints`; tiap endpoint dipindahkan ke `paths` pada PR yang mengimplementasikannya.
    Setiap respons di `paths` divalidasi terhadap skema di berkas ini oleh `./gradlew contractTest`.

    Kode & pesan error mengikuti PRD Draft 1.2 Lampiran B; riwayat keputusannya di `docs/prd-gaps-m1.md`
    dan `docs/prd-gaps-m2.md`.

    Konvensi (PRD §6):
      * JSON UTF-8, field camelCase; kolom database snake_case. Nilai kosong dikirim sebagai `null`.
      * Waktu ISO-8601 UTC dengan milidetik (`2026-08-29T04:24:00.000Z`).
      * Tanggal bisnis `YYYY-MM-DD` zona Asia/Jakarta, diturunkan dari `capturedAt`.
      * Uang integer rupiah (`45000`); kuantitas desimal satu angka di belakang koma (`4.5`).
      * `error.message` adalah kalimat Bahasa Indonesia yang ditampilkan ke kasir apa adanya.
      * Semua endpoint bisnis ada di bawah `/api/v1` dan dibatasi 120 request/menit per perangkat.
  contact:
    name: Tim Backend Prima Wash
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Lokal (docker compose)
  - url: https://pwl-cashier-staging-rvz75.ondigitalocean.app
    description: Staging — dipakai untuk shadow mode
  - url: https://api.primawash.id
    description: Produksi

tags:
  - name: health
    description: Liveness & readiness untuk load balancer dan monitoring.
  - name: auth
    description: Layar login (pilih cabang → PIN), sesi, tablet (PRD §8.1).
  - name: master-data
    description: Cabang, staff, price list, loyalty, reward (PRD §8.2–§8.4).
  - name: customer
    description: Customer & poin (PRD §8.5).
  - name: order
    description: Order, status, sinkronisasi offline (PRD §8.6, §11).
  - name: shift
    description: Shift & kas (PRD §8.7).
  - name: sync
    description: Cache tablet (bootstrap, delta sync) dan heartbeat (PRD §8.10).
  - name: report
    description: Dashboard, penjualan harian, audit (M3).
  - name: whatsapp
    description: Outbox, kegagalan, webhook Meta (M5 — fase akhir).

security:
  - staffToken: []

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness
      description: Selalu 200 selama proses hidup. Tidak butuh autentikasi dan tidak menyentuh database.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Proses hidup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP
                version: 0.1.0-SNAPSHOT

  /health/ready:
    get:
      tags: [health]
      summary: Readiness
      description: |
        Mengecek koneksi database. Dipakai deployment staging/produksi untuk menahan trafik sampai
        migrasi selesai dan pool siap.
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Siap menerima trafik.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: READY
                database: UP
        "503":
          description: Database tidak dapat dihubungi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: NOT_READY
                database: DOWN

  # ---------------------------------------------------------------------------------------------
  # Layar login & sesi — PRD §8.1 (tanpa aktivasi perangkat, lihat docs/prd-gaps-m1.md)
  # ---------------------------------------------------------------------------------------------
  /api/v1/devices:
    get:
      tags: [auth]
      summary: Daftar tablet (owner)
      description: |
        Tablet yang pernah berhasil login, terbaru dulu, termasuk yang sudah diblokir. Tablet tercatat
        otomatis dari `X-Device-Id` pada login pertamanya — tidak ada langkah aktivasi. Instalasi yang
        hanya mencoba PIN tanpa pernah berhasil tidak ditampilkan.
      operationId: listDevices
      responses:
        "200":
          description: Daftar tablet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/devices/{id}:
    delete:
      tags: [auth]
      summary: Blokir tablet (owner)
      description: |
        Untuk tablet yang hilang: tablet tidak bisa login PIN maupun refresh lagi, dan semua sesinya
        dicabut dalam transaksi yang sama. Memblokir tablet yang sudah diblokir → `changed: false` tanpa
        audit. Audit `DEVICE_REVOKED` "Blokir perangkat {nama}". `{id}` = `X-Device-Id` tablet tsb.
      operationId: revokeDevice
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Perangkat dicabut.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceChangeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/login-options:
    get:
      tags: [auth]
      summary: Pilihan layar login
      description: |
        **Publik** — layar pertama aplikasi, termasuk setelah fresh install. Cabang, nama pendek kasir
        aktif, dan status shift terakhir per cabang. Bila `X-Device-Id` dikirim dan tablet itu pernah
        login, `lastBranchId` berisi cabang terakhirnya untuk dipilih otomatis. **Tidak pernah** mengirim
        data PIN.
      operationId: getLoginOptions
      security: []
      parameters:
        - $ref: "#/components/parameters/DeviceIdOptional"
      responses:
        "200":
          description: Pilihan login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginOptionsResponse"
              example:
                lastBranchId: 7f1c2d3e-0000-4000-8000-000000000001
                branches:
                  - id: 7f1c2d3e-0000-4000-8000-000000000001
                    code: FMU
                    name: Familia Urban
                    address: Ruko Arundaya, Jl. Familia Urban Blok DD. 21
                    hours: 07.00 – 21.00
                    active: true
                    cashierNames: [Siti N., Bagas A.]
                    shift:
                      open: true
                      openedByName: Siti Nurhaliza

  /api/v1/auth/pin-login:
    post:
      tags: [auth]
      summary: Login PIN di cabang yang dipilih
      description: |
        **Publik** — cukup pilih cabang dan ketik PIN, tanpa aktivasi perangkat. Header `X-Device-Id`
        wajib: ID instalasi yang dibuat aplikasi sendiri saat pertama dibuka (UUID, disimpan permanen,
        tidak pernah ditampilkan ke pengguna). Tablet tercatat di server pada percobaan pertamanya.
        Maksimal 20 percobaan per alamat jaringan per 5 menit → `429 RATE_LIMITED`.

        Urutan pengecekan (`LoginWithPinUseCase`), kesalahan pertama yang dikembalikan:

        | # | Kondisi | HTTP / code | `details.clearPin` |
        |---|---|---|---|
        | 0 | `X-Device-Id` tidak ada / bukan UUID | 400 `VALIDATION_ERROR` | — |
        | 1 | Cabang tidak ada / id tidak valid | 422 `BRANCH_REQUIRED` | false |
        | 2 | Cabang nonaktif | 422 `BRANCH_INACTIVE` | false |
        | 3 | PIN bukan 4–6 digit angka | 422 `PIN_FORMAT` | false |
        | 4a | Tablet diblokir owner | 401 `DEVICE_UNAUTHORIZED` | — |
        | 4b | Tablet terkunci (5 PIN salah dalam 5 menit) | 423 `PIN_LOCKED` + `Retry-After` | true |
        | 5 | PIN tidak cocok | 422 `PIN_UNKNOWN` | true |
        | 6 | Akun terkunci (5 salah berturut-turut di verify-pin/switch-staff) | 423 `PIN_LOCKED` | true |
        | 7 | Akun nonaktif | 422 `STAFF_INACTIVE` | true |
        | 8 | Kasir di cabang lain | 422 `STAFF_WRONG_BRANCH` | true |

        Penolakan #5–#8 diaudit `LOGIN_FAILED` (tanpa PIN) dan dihitung ke batas perangkat; percobaan
        yang memicu kunci tetap mendapat error-nya sendiri, percobaan berikutnya `423`.

        Sukses: `last_login_at`, sesi baru (sesi lain di perangkat ini berakhir), `last_branch_id`
        perangkat, audit `LOGIN` "Login PIN sebagai kasir Familia Urban di perangkat Cabang Familia Urban" /
        "… sebagai owner/admin …", dan — pada login pertama sebuah tablet — `DEVICE_ACTIVATED`. Header
        `Cache-Control: no-store`.
      operationId: pinLogin
      security: []
      parameters:
        - $ref: "#/components/parameters/DeviceIdRequired"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinLoginRequest"
            example:
              branchId: 7f1c2d3e-0000-4000-8000-000000000001
              pin: "1234"
      responses:
        "200":
          description: Login berhasil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/DeviceBlocked"
        "422":
          $ref: "#/components/responses/BusinessRule"
        "423":
          $ref: "#/components/responses/PinLocked"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Perpanjang access token
      description: |
        Refresh token dirotasi setiap dipakai — token lama langsung tidak berlaku. Sesi tetap berakhir
        18 jam sejak login (rotasi tidak memperpanjangnya), sehingga `refreshTokenExpiresIn` adalah
        sisa waktunya. Publik (tanpa access token), tetapi `X-Device-Id` wajib dan harus tablet yang
        sama dengan saat login. Token tidak dikenal, dicabut, kedaluwarsa, atau milik tablet lain → 401
        `UNAUTHENTICATED`; tablet diblokir → 401 `DEVICE_UNAUTHORIZED`.
      operationId: refreshSession
      security: []
      parameters:
        - $ref: "#/components/parameters/DeviceIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token baru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/auth/verify-pin:
    post:
      tags: [auth]
      summary: Verifikasi PIN staff tertentu
      description: |
        Dipakai layar Kas sebelum buka shift (`VerifyStaffPinUseCase`). Urutan: staff dipilih
        (`STAFF_REQUIRED` "Pilih staff dulu.") → akun aktif (`STAFF_INACTIVE`) → boleh bekerja di
        cabang token (`STAFF_WRONG_BRANCH`) → PIN 4–6 digit (`PIN_FORMAT`) → perangkat/akun tidak
        terkunci (`423 PIN_LOCKED`) → PIN cocok (`PIN_WRONG` "PIN salah untuk {nama}. Coba lagi.").
        PIN salah dihitung ke batas perangkat dan ke kunci akun (5 berturut-turut → 15 menit, audit
        `PIN_LOCKED`). `staffProof` sekali pakai, berlaku 5 menit; server hanya menyimpan hash-nya.
      operationId: verifyPin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffPinRequest"
      responses:
        "200":
          description: PIN benar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyPinResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/BusinessRule"
        "423":
          $ref: "#/components/responses/PinLocked"

  /api/v1/auth/switch-staff:
    post:
      tags: [auth]
      summary: Serahkan perangkat ke staff lain
      description: |
        Validasi sama dengan verify-pin, lalu sesi pemanggil berakhir dan sesi baru terbit untuk staff
        tsb di cabang yang sama. Audit `STAFF_SWITCHED` "Login PIN sebagai {kasir Familia Urban | owner/admin}".
        Bila staff baru kasir, klien keluar dari layar owner.
      operationId: switchStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffPinRequest"
      responses:
        "200":
          description: Sesi baru untuk staff yang masuk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/BusinessRule"
        "423":
          $ref: "#/components/responses/PinLocked"

  /api/v1/auth/switch-branch:
    post:
      tags: [auth]
      summary: Pindah konteks cabang perangkat (owner)
      description: |
        Urutan: pemanggil owner (`403 OWNER_ONLY` "Perangkat kasir terikat ke Cabang {nama}. Hanya
        owner/admin yang bisa memindahkan perangkat ke cabang lain.") → cabang ada (404) → cabang aktif
        (`BRANCH_INACTIVE`). Cabang berbeda → token baru, sesi lama berakhir, audit
        `DEVICE_BRANCH_SWITCHED`. Cabang sama → `changed: false`, token `null`.
      operationId: switchBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchBranchRequest"
      responses:
        "200":
          description: Hasil pindah cabang.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwitchBranchResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRule"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout
      description: Mencabut sesi, audit `LOGOUT` "Logout dari perangkat Cabang {nama}", dan mengembalikan cabang untuk preselect.
      operationId: logout
      responses:
        "200":
          description: Sesi berakhir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/me:
    get:
      tags: [auth]
      summary: Konteks sesi
      operationId: getMe
      responses:
        "200":
          description: Staff dan cabang sesi ini.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionContext"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  # ---------------------------------------------------------------------------------------------
  # Cabang — PRD §8.2
  # ---------------------------------------------------------------------------------------------
  /api/v1/branches:
    get:
      tags: [master-data]
      summary: Semua cabang
      description: Kasir juga butuh kode & nama cabang untuk tampilan.
      operationId: listBranches
      responses:
        "200":
          description: Cabang urut `sort_order`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/branches/overview:
    get:
      tags: [master-data]
      summary: Ringkasan per cabang (owner)
      description: |
        Omzet & transaksi pada `date` (dari `daily_sales`; nol sampai M2 mencatat penjualan), rasio
        target, shift terakhir, dan nama pendek kasir aktif. `date` default hari ini WIB.
      operationId: getBranchOverview
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Ringkasan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchOverviewResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/branches/{id}:
    patch:
      tags: [master-data]
      summary: Ubah target harian dan/atau status aktif (owner)
      description: |
        Aturan (semua dicek sebelum ada yang ditulis): cabang ada (404) → `dailyTarget` > 0
        (`TARGET_REQUIRED` "Target harian tidak boleh kosong — dikembalikan ke {target lama}.") →
        cabang yang sedang dipakai perangkat pemanggil tidak bisa dinonaktifkan (`BRANCH_IN_USE`).
        Nilai sama → `changed: false` tanpa audit. Audit `BRANCH_TARGET_CHANGED` "Ubah target harian
        Cabang Familia Urban: Rp5.200.000 → Rp5.500.000" dan/atau `BRANCH_TOGGLED` "Nonaktifkan Cabang {nama}".
        Cabang nonaktif menolak login & buka shift baru.
      operationId: updateBranch
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBranchRequest"
            example:
              dailyTarget: 5500000
      responses:
        "200":
          description: Cabang setelah perubahan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchChangeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRule"

  # ---------------------------------------------------------------------------------------------
  # Staff — PRD §8.3
  # ---------------------------------------------------------------------------------------------
  /api/v1/staff:
    get:
      tags: [master-data]
      summary: Daftar akun staff
      description: |
        **Owner:** semua field `Staff`, filter opsional `branchId` & `active`.
        **Kasir:** hanya staff aktif yang boleh bekerja di cabangnya (kasir cabang itu + owner), field
        `StaffCandidate` saja — kandidat dialog PIN. Kasir yang mengirim `branchId` cabang lain →
        `403 BRANCH_SCOPE`.
      operationId: listStaff
      parameters:
        - name: branchId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Akun staff, tanpa data PIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [master-data]
      summary: Tambah staff (owner)
      description: |
        Urutan (`AddStaffUseCase`): nama wajib (`NAME_REQUIRED`) → PIN 4–6 digit (`PIN_FORMAT` "PIN harus
        4–6 digit.") → PIN tidak dipakai staff aktif lain (`PIN_TAKEN`) → kasir wajib punya cabang
        (`CASHIER_NEEDS_BRANCH`). Owner selalu `branchId = null`. `shortName` diturunkan server. Audit
        `STAFF_ADDED` "Tambah akun staff {nama} (kasir, Cabang Familia Urban) · PIN dibuat". Body tidak pernah
        di-log.
      operationId: createStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffRequest"
            example:
              name: Dimas Pratama
              pin: "4321"
              role: KASIR
              branchId: 7f1c2d3e-0000-4000-8000-000000000003
      responses:
        "201":
          description: Akun dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRule"

  /api/v1/staff/{id}/reset-pin:
    post:
      tags: [master-data]
      summary: Reset PIN (owner)
      description: |
        PIN 4 digit acak yang tidak bentrok dengan **semua** akun. PIN lama langsung tidak berlaku, semua
        sesi staff tsb dicabut. PIN baru dikembalikan **sekali** — `Cache-Control: no-store`, tidak
        pernah di-log. Audit `STAFF_PIN_RESET` "Reset PIN {nama} — PIN lama dicabut".
      operationId: resetStaffPin
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: PIN baru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPinResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/staff/{id}:
    patch:
      tags: [master-data]
      summary: Aktif/nonaktifkan akun (owner)
      description: |
        Menonaktifkan akun sendiri → `STAFF_SELF_DEACTIVATE`; owner aktif terakhir → `LAST_OWNER`.
        Mengaktifkan akun yang PIN-nya kini dipakai staff aktif lain → `409 PIN_CONFLICT` (T2).
        Menonaktifkan mencabut semua sesinya. Nilai sama → `changed: false` tanpa audit. Audit
        `STAFF_TOGGLED` "Nonaktifkan akun {nama}" / "Aktifkan akun {nama}".
      operationId: updateStaff
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleActiveRequest"
      responses:
        "200":
          description: Akun setelah perubahan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffChangeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/BusinessRule"

  # ---------------------------------------------------------------------------------------------
  # Price list, loyalty, reward — PRD §8.4
  # ---------------------------------------------------------------------------------------------
  /api/v1/services:
    get:
      tags: [master-data]
      summary: Price list
      description: Kasir selalu hanya melihat layanan aktif, apa pun nilai `includeInactive`.
      operationId: listServices
      parameters:
        - $ref: "#/components/parameters/IncludeInactive"
      responses:
        "200":
          description: Layanan urut `sort_order`.
          content:
